<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | CS2 Case Control</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <script>checkAuth();</script>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
</head>
<body>

    <!-- Particles Background -->
    <canvas id="bg-particles"></canvas>

    <!-- Navbar Container -->
    <div id="navbar"></div>

    <!-- Main Content -->
    <main class="section-padding mt-5">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-5">
                <div>
                    <h1 class="display-4 fw-bold">Panel de Administrador</h1>
                    <p class="text-secondary">Actualiza los precios base de las cajas manualmente.</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-premium btn-premium-primary" id="btn-generate-json">
                        Generar JSON
                    </button>
                    <button class="btn btn-premium btn-premium-outline" onclick="logout()">
                        Salir
                    </button>
                </div>
            </div>

            <div class="glass-card p-4">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr class="text-secondary border-secondary">
                                <th>Caja</th>
                                <th>Categoría</th>
                                <th class="text-center">Steam Market</th>
                                <th class="text-end" style="width: 150px;">Precio Actual (€)</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal JSON Output -->
    <div class="modal fade" id="jsonModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card" style="background: rgba(15, 15, 15, 0.95);">
                <div class="modal-header border-0">
                    <h5 class="modal-title">JSON Generado</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-secondary mb-3">Copia este contenido y pégalo en el archivo <code>data/cajas.json</code> para aplicar los cambios.</p>
                    <textarea id="json-output" class="form-control bg-dark border-secondary text-white font-monospace" rows="15" readonly></textarea>
                    <button class="btn btn-premium btn-premium-primary w-100 mt-3" id="btn-copy-json">
                        Copiar al Portapapeles
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.27/bundled/lenis.min.js"></script>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
