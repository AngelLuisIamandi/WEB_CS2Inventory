<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | CS2 Case Control</title>
    <meta name="description" content="Acceso restringido al panel de administración de CS2 Inventory.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Login Admin | CS2 Case Control">
    <meta property="og:description" content="Acceso a la gestión privada de inventario.">
    <meta property="og:image" content="assets/img/icon.svg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <!-- Particles Background -->
    <canvas id="bg-particles"></canvas>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="glass-card p-5 text-center">
                    <div class="mb-4">
                        <img src="assets/img/icon.svg" alt="CS2 Logo" style="width: 64px; height: 64px; filter: drop-shadow(0 0 10px rgba(0, 123, 255, 0.5));">
                    </div>
                    <h3 class="fw-bold mb-2">Administración</h3>
                    <p class="text-secondary small mb-4">Introduce la contraseña maestra</p>
                    
                    <form id="login-form">
                        <div class="mb-3">
                            <input type="password" id="admin-password" class="form-control bg-dark border-secondary text-white text-center py-3" placeholder="Contraseña" required autofocus>
                        </div>
                        <div id="login-error" class="text-danger small mb-3 d-none">Contraseña incorrecta</div>
                        <button type="submit" class="btn btn-premium btn-premium-primary w-100">Acceder</button>
                    </form>
                    
                    <a href="index.html" class="d-block mt-4 text-secondary text-decoration-none small">
                        <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
